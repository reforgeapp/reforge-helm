name: Check chart
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.20.0
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint charts/reforge --strict --kube-version 1.36.3
      - run: python scripts/test_provisioning.py
      - run: python scripts/check_chart.py
      - run: |
          mkdir -p "$RUNNER_TEMP/reforge-tools"
          GOBIN="$RUNNER_TEMP/reforge-tools" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          curl -fsSL https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.6.1/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml -o "$RUNNER_TEMP/httproute.yaml"
          python -c 'import json,sys,yaml; crd=yaml.safe_load(open(sys.argv[1])); json.dump(next(v["schema"]["openAPIV3Schema"] for v in crd["spec"]["versions"] if v["name"]=="v1"),open(sys.argv[2],"w"))' "$RUNNER_TEMP/httproute.yaml" "$RUNNER_TEMP/httproute_v1.json"
          for values in examples/reforgeapp.yaml examples/external.yaml examples/gateway-api.yaml; do
            helm template reforge charts/reforge --namespace reforge --kube-version 1.36.3 -f "$values" > "$RUNNER_TEMP/reforge.yaml"
            "$RUNNER_TEMP/reforge-tools/kubeconform" -strict -summary -kubernetes-version 1.36.3 -schema-location default -schema-location "$RUNNER_TEMP/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" "$RUNNER_TEMP/reforge.yaml"
          done
      - run: helm package charts/reforge --destination dist
  release:
    if: github.event_name == 'push'
    needs: chart
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.20.0
      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f
        with:
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
